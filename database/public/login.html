<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="wrapper">
        <form action="/login" method="post">
            <h1>Login</h1>
            <p id="error-msg" class="error-msg">Username or password was incorrect, try again</p>
            <div class="input-box">
                <input type="text" name="username" placeholder="Username">
            </div>
            <div class="input-box">
                <input type="password" name="password" placeholder="Password" required maxlength="72" autocomplete="current-password">
            </div>
            <div class="remember-forgot">
                <label>
                    <input type="checkbox" >
                    Remember me
                </label>
                <a href="#">Forgot password?</a>
            </div>

            <button type="submit" class="login-btn">Login</button>

            <div class="register-link">
                <p>
                    Don't have an account?
                    <a href="register.html">Register</a>
                </p>
            </div>
        </form>
    </div>
    <script src="/auth-messages.js"></script>
</body>
</html>
