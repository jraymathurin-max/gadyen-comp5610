<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="wrapper">
        <form action="/register" method="post">
            <h1>Register</h1>
            <p id="error-username-taken" class="error-msg">Username already taken, please try again</p>

            <div class="input-box">
                <input type="text" name="name" placeholder="Name" required>
            </div>

            <div class="input-box">
                <input type="text" name="email" placeholder="Enter your email" required>
            </div>

            <div class="input-box">
                <input type="text" name="username" placeholder="Username" required>
            </div>

            <div class="input-box">
                <input type="password" name="password" placeholder="Password" required minlength="12" maxlength="72" autocomplete="new-password">
            </div>

            <!-- <div class="input-box">
                <input type="password" name="re_enter_password" placeholder="Re-enter password" required>
            </div> -->
            <button type="submit" class="create_account-btn">Create an account</button>
            <div class="already-have-account">
                <p">Already have an account<a href="/">Login</a></p>
            </div>
        </form>
    </div>
    <script src="/auth-messages.js"></script>
</body>
</html>
