<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Verification</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <canvas id="net-bg" aria-hidden="true"></canvas>

    <div class="wrapper">
        <form action="/verify" method="POST">
            <div class="brand">
                <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M12 2 20 5.5v6.2c0 5-3.3 8.6-8 10.3-4.7-1.7-8-5.3-8-10.3V5.5Z"/>
                    <path d="m8.3 12 2.7 2.9 4.8-5.6"/>
                </svg>
                <span>Gadyen Safeguard</span>
            </div>

            <h1>Verify Your Email</h1>
            <p id="error-msg" class="error-msg">Invalid code, try again</p>
            <p>Enter the six-digit verification code sent to your email.</p>

            <input type="hidden" name="email" id="email">

            <div class="input-box">
                <input type="text" name="otp" placeholder="Enter OTP" aria-label="Verification code"
                       maxlength="6" pattern="[0-9]{6}" inputmode="numeric"
                       autocomplete="one-time-code" required>
            </div>

            <button type="submit" class="login-btn">Verify Email</button>
        </form>
    </div>

    <script src="/network-bg.js"></script>
    <script>
        const params = new URLSearchParams(window.location.search);
        document.getElementById("email").value = params.get("email") || "";

        if (params.get("error")) {
            document.getElementById("error-msg").style.display = "block";
        }
    </script>
</body>
</html>
