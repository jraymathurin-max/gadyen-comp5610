<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create a Gadyen Safeguard account</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <canvas id="net-bg" aria-hidden="true"></canvas>
    <div class="wrapper">
        <form action="/register" method="post">
            <div class="brand">
                <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M12 2 20 5.5v6.2c0 5-3.3 8.6-8 10.3-4.7-1.7-8-5.3-8-10.3V5.5Z"/>
                    <path d="m8.3 12 2.7 2.9 4.8-5.6"/>
                </svg>
                <span>Gadyen Safeguard</span>
            </div>
            <h1>Register</h1>
            <p id="error-username-taken" class="error-msg">Username already taken, please try again</p>

            <div class="input-box">
                <input type="text" name="name" placeholder="Name" aria-label="Name"
                       autocomplete="name" required>
            </div>

            <div class="input-box">
                <input type="email" name="email" placeholder="Enter your email" aria-label="Email"
                       autocomplete="email" required>
            </div>

            <div class="input-box">
                <input type="text" name="username" placeholder="Username" aria-label="Username"
                       autocomplete="username" required>
            </div>

            <div class="input-box">
                <input type="password" name="password" placeholder="Password" aria-label="Password"
                       autocomplete="new-password" required minlength="12" maxlength="72">
            </div>

            <button type="submit" class="create_account-btn">Create an account</button>
            <div class="already-have-account">
                <p>Already have an account? <a href="/">Login</a></p>
            </div>
        </form>
    </div>
    <script src="/network-bg.js"></script>
    <script src="/auth-messages.js"></script>
</body>
</html>
