<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gadyen Safeguard</title>
    <link rel="stylesheet" href="/dashboard_styles.css">
</head>
<body>
    <canvas id="net-bg" aria-hidden="true"></canvas>

    <div class="chat-container">
        <header>
            <button id="history-toggle" class="history-toggle" type="button"
                    aria-label="Show conversations" aria-expanded="false" aria-controls="sidebar">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
            </button>
            <div class="brand">
                <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M12 2 20 5.5v6.2c0 5-3.3 8.6-8 10.3-4.7-1.7-8-5.3-8-10.3V5.5Z"/>
                    <path d="m8.3 12 2.7 2.9 4.8-5.6"/>
                </svg>
                <h1>Gadyen Safeguard</h1>
            </div>
            <label class="lang-switch">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <circle cx="12" cy="12" r="9"/>
                    <path d="M3 12h18M12 3c2.7 2.6 4 5.6 4 9s-1.3 6.4-4 9c-2.7-2.6-4-5.6-4-9s1.3-6.4 4-9Z"/>
                </svg>
                <span class="visually-hidden" id="lang-label">Language</span>
                <select id="lang-select" aria-labelledby="lang-label"></select>
            </label>
            <div class="account">
                <button id="account-btn" class="account-btn" type="button" aria-label="Account"
                        aria-haspopup="true" aria-expanded="false" aria-controls="account-menu">
                    <span id="account-initial" class="account-initial" aria-hidden="true"></span>
                    <span id="account-name" class="account-name"></span>
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 10 5 5 5-5"/></svg>
                </button>
                <div id="account-menu" class="account-menu" hidden>
                    <p id="account-full" class="account-full" dir="auto"></p>
                    <p id="account-user" class="account-user"></p>
                    <button id="logout-btn" class="logout-btn" type="button">Sign out</button>
                </div>
            </div>
        </header>

        <div class="workspace">
            <aside id="sidebar" class="sidebar">
                <button id="new-chat-btn" class="new-chat" type="button">+ New conversation</button>
                <h2 id="history-title">Earlier conversations</h2>
                <ul id="history-list" class="history-list"></ul>
                <p id="history-empty" class="history-empty">No earlier conversations yet.</p>
            </aside>

            <div class="conversation">
                <div id="chat-box" class="chat-box" role="log" aria-live="polite"></div>

                <!-- Shown until the customer has picked a language -->
                <div id="lang-picker" class="lang-picker" hidden>
                    <h2>Choose your language</h2>
                    <div id="lang-options" class="lang-options"></div>
                </div>

                <div class="input-area">
                    <input type="text" id="user-input" maxlength="4000" autocomplete="off"
                           placeholder="Type your message" aria-label="Type your message" dir="auto"/>
                    <button id="send-btn" type="button">Send</button>
                </div>
            </div>
        </div>
    </div>

    <a href="/user-info" class="personal-information">
        <img src="/images/user.png" alt="">
    </a>

    <script src="/network-bg.js"></script>
    <script src="/chatbot-script.js"></script>
</body>
</html>
